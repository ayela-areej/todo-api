name: Todo API CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore API
        run: dotnet restore todo-api.csproj

      - name: Restore tests
        run: dotnet restore tests/todo-api.Tests.csproj

      - name: Build application
        run: dotnet build todo-api.csproj --no-restore

      - name: Build tests
        run: dotnet build tests/todo-api.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test tests/todo-api.Tests.csproj --no-build

      - name: Publish application
        run: dotnet publish todo-api.csproj -c Release -o publish --no-restore

      - name: Build Docker image
        run: docker build -t ayela/todo-api:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker image
        run: docker push ayela/todo-api:latest

  deploy-to-ec2:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ayela/todo-api:latest
            docker stop todo-api || true
            docker rm todo-api || true
            docker run -d \
              --name todo-api \
              -p 8081:8080 \
              --restart unless-stopped \
              ayela/todo-api:latest