name: Todo API CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore API
        run: dotnet restore todo-api.csproj

      - name: Restore tests
        run: dotnet restore tests/todo-api.Tests.csproj

      - name: Build application
        run: dotnet build todo-api.csproj --no-restore

      - name: Build tests
        run: dotnet build tests/todo-api.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test tests/todo-api.Tests.csproj --no-build

      - name: Publish application
        run: dotnet publish todo-api.csproj -c Release -o publish --no-build